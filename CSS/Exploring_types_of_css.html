<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline</title>
    <style>
        body{
            background-color: chocolate;
            background-image:url("https://upload.wikimedia.org/wikipedia/commons/f/f1/Virat_Kohli_in_New_Delhi_in_December_2018.jpg");
            background-size:contain;
            background-position:center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin:0;
            height: 100vh;
        }
        .box{
            height:40px;
            width: 40px;
        }
        #box1{
            background-color: red;}
            
        #box2{
            background-color: black;
        }
    </style>
</head>
<!---Inline CSS-->
<body>
    <h1 style="color: red;">India is in the Asian continent</h1>
    <p style="width: auto;height: fit-content; color:beige ;">Lorem ipsum dolor 
    it amet consectetur adipisicing elit. Culpa ipsa a qui aliquam nisi modi libero excepturi in sed at facere, vitae alias, facilis recusandae, necessitatibus iste consequatur voluptates eaque?</p>
     <div id="box1" class="box">BOX 1</div>
     <div id="box2" class="box">BOX 2</div>
</body>
</html>
